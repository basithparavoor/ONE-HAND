<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 overflow-hidden h-screen">

    <!-- Login Screen -->
    <div id="login-section" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 relative hidden">
        <div class="absolute inset-0 z-0">
            <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-teal-500/20 blur-[120px]"></div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-white/20 z-10 text-white">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Portal</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300 uppercase">Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300 uppercase">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-white">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold p-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2 mt-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i> Secure Login
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-section" class="hidden h-screen flex flex-col md:flex-row w-full bg-slate-50">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20 shrink-0">
            <div class="p-6 font-bold text-white text-xl border-b border-slate-800 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center">
                    <i data-lucide="heart-handshake" class="w-4 h-4"></i>
                </div>
                SSF Admin
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button id="nav-overview" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-800 text-white font-medium transition-all shadow-sm">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-emerald-400"></i> Overview
                </button>
                <button id="nav-verify" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800 hover:text-white font-medium transition-all text-slate-400">
                    <i data-lucide="badge-indian-rupee" class="w-5 h-5"></i> Donations
                </button>
                <button id="nav-settings" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800 hover:text-white font-medium transition-all text-slate-400">
                    <i data-lucide="settings-2" class="w-5 h-5"></i> CMS Settings
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button id="logout-btn" class="w-full flex items-center gap-3 p-3 rounded-xl text-red-400 hover:bg-red-500/10 font-medium transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 h-screen overflow-y-auto relative bg-slate-50">
            
            <!-- OVERVIEW TAB -->
            <div id="tab-overview" class="p-6 md:p-10 space-y-8 animate-fade-in-up">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-slate-900">Campaign Analytics</h2>
                    <select id="analytics-timeframe" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm outline-none">
                        <option value="all">All Time</option>
                        <option value="month">This Month</option>
                        <option value="week">This Week</option>
                        <option value="today">Today</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <span class="text-sm font-bold text-slate-400 uppercase">Total Raised</span>
                        <h3 id="stat-total-raised" class="text-3xl font-extrabold text-slate-900 mt-2">₹0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <span class="text-sm font-bold text-slate-400 uppercase">Pending Action</span>
                        <h3 id="stat-pending-count" class="text-3xl font-extrabold text-amber-600 mt-2">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <span class="text-sm font-bold text-slate-400 uppercase">Supporters</span>
                        <h3 id="stat-donors" class="text-3xl font-extrabold text-blue-600 mt-2">0</h3>
                    </div>
                </div>
            </div>

            <!-- DONATIONS TAB -->
            <div id="tab-verify" class="hidden p-6 md:p-10 h-full flex flex-col space-y-4">
                <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200 gap-4">
                    
                    <!-- Bulk Actions -->
                    <div id="bulk-actions" class="hidden flex items-center gap-3">
                        <span id="bulk-count" class="text-sm font-bold text-slate-600 px-2">0 selected</span>
                        <button id="btn-bulk-verify" class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-emerald-200"><i data-lucide="check-check" class="w-4 h-4"></i> Verify All</button>
                        <button id="btn-bulk-delete" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-red-200"><i data-lucide="trash" class="w-4 h-4"></i> Delete All</button>
                    </div>

                    <!-- Search/Filters -->
                    <div class="flex gap-3 ml-auto w-full md:w-auto">
                        <div class="relative w-full md:w-64">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="search-input" placeholder="Search name or UTR..." class="w-full bg-slate-50 border border-slate-200 pl-9 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                        </div>
                        <select id="status-filter" class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-sm outline-none">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="verified">Verified</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 overflow-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 border-b sticky top-0 z-10">
                            <tr>
                                <th class="p-4"><input type="checkbox" id="selectAll" class="w-4 h-4 rounded"></th>
                                <th class="p-4 font-bold text-xs uppercase text-slate-500">Donor / Phone</th>
                                <th class="p-4 font-bold text-xs uppercase text-slate-500">Amount / UTR</th>
                                <th class="p-4 font-bold text-xs uppercase text-slate-500 text-center">Receipt & Msg</th>
                                <th class="p-4 font-bold text-xs uppercase text-slate-500">Status</th>
                                <th class="p-4 font-bold text-xs uppercase text-slate-500 text-right pr-6">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="donations-tbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="tab-settings" class="hidden p-6 md:p-10 max-w-4xl space-y-6">
                <h2 class="text-2xl font-bold text-slate-900">CMS & Settings</h2>
                <form id="settings-form" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Campaign Title</label>
                            <input type="text" id="setting_title" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Receiving UPI ID</label>
                            <input type="text" id="setting_upi" class="w-full border p-3 rounded-xl font-mono outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1 text-slate-500">Campaign End Date (Timer)</label>
                            <input type="datetime-local" id="setting_end_date" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>
                    <button type="submit" id="save-settings-btn" class="bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl hover:scale-105 transition flex items-center gap-2">
                        <i data-lucide="save"></i> Save Settings
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- MODALS OVERLAYS -->
    <!-- Receipt Lightbox Modal -->
    <div id="modal-receipt" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 p-4 hidden">
        <div class="modal-content relative bg-white rounded-2xl overflow-hidden max-w-2xl w-full">
            <button onclick="closeModal('modal-receipt')" class="absolute top-4 right-4 bg-black/50 hover:bg-black text-white p-2 rounded-full transition-colors z-10">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="bg-slate-200 p-4 flex justify-center items-center min-h-[300px] max-h-[70vh] overflow-auto">
                <img id="modal-receipt-img" src="" class="max-w-full h-auto rounded-lg shadow-sm" alt="Receipt">
            </div>
        </div>
    </div>

    <!-- Edit Amount Modal -->
    <div id="modal-edit" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 p-4 hidden">
        <div class="modal-content bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-5 h-5 text-blue-500"></i> Edit Amount
            </h3>
            <input type="hidden" id="edit-id">
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">New Amount (₹)</label>
                <input type="number" id="edit-amount-input" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-lg">
            </div>
            <div class="flex gap-3 justify-end">
                <button onclick="closeModal('modal-edit')" class="px-5 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                <button onclick="submitEdit()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
