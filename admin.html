<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 font-sans antialiased">

    <div id="login-section" class="min-h-screen flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" required class="w-full border p-2 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full border p-2 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white p-2 rounded-lg hover:bg-slate-800 transition">Log In</button>
            </form>
        </div>
    </div>

    <div id="dashboard-section" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col">
            <div class="p-6 font-bold text-white text-xl border-b border-slate-800">SSF Admin</div>
            <nav class="flex-1 p-4 space-y-2">
                <button id="nav-verify" class="w-full flex items-center gap-3 p-3 rounded-lg bg-emerald-600 text-white transition">
                    <i data-lucide="check-square" class="w-5 h-5"></i> Verify Payments
                </button>
                <button id="nav-settings" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i data-lucide="settings" class="w-5 h-5"></i> Site Settings
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button id="logout-btn" class="w-full flex items-center gap-3 p-3 rounded-lg text-red-400 hover:bg-slate-800 transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto h-screen">
            
            <div id="tab-verify" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-slate-900">Pending & Verified Donations</h2>
                    <button id="export-csv" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 hover:bg-slate-700 transition">
                        <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="p-4 font-medium text-slate-600">Date</th>
                                <th class="p-4 font-medium text-slate-600">Donor</th>
                                <th class="p-4 font-medium text-slate-600">Amount / UTR</th>
                                <th class="p-4 font-medium text-slate-600">Receipt</th>
                                <th class="p-4 font-medium text-slate-600">Status</th>
                                <th class="p-4 font-medium text-slate-600">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="donations-tbody" class="divide-y">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="tab-settings" class="hidden max-w-3xl space-y-6">
                <h2 class="text-2xl font-bold text-slate-900">CMS & Settings</h2>
                <form id="settings-form" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium mb-1">Campaign Title</label>
                            <input type="text" id="setting_title" class="w-full border p-2 rounded-lg">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium mb-1">Description</label>
                            <textarea id="setting_desc" rows="3" class="w-full border p-2 rounded-lg"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Campaign Type</label>
                            <select id="setting_type" class="w-full border p-2 rounded-lg bg-white">
                                <option value="fixed_amount">Fixed Amount Goal</option>
                                <option value="unit_based">Unit/Sponsor Based Goal</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">UPI ID</label>
                            <input type="text" id="setting_upi" class="w-full border p-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Target Amount (if fixed)</label>
                            <input type="number" id="setting_target_amt" class="w-full border p-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Unit Cost (if unit based)</label>
                            <input type="number" id="setting_unit_cost" class="w-full border p-2 rounded-lg">
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" id="save-settings-btn" class="bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700 transition">Save Changes</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
