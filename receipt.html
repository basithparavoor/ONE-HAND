<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Receipt - SSF Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    
    <div class="bg-white rounded-[2rem] shadow-xl p-8 w-full max-w-sm text-center border border-slate-200">
        <!-- Success Icon -->
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-5 shadow-sm">
            <i data-lucide="check-circle" class="w-8 h-8"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Thank You!</h1>
        <p class="text-slate-500 text-sm font-medium mb-6">Here is your official donation receipt.</p>
        
        <!-- Image Viewer Canvas -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden mb-6 min-h-[300px] flex items-center justify-center relative shadow-inner">
            <div id="loader" class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-emerald-500"></i>
            </div>
            <img id="receipt-img" class="w-full h-auto hidden relative z-10 transition-opacity duration-300" alt="Official Receipt">
        </div>
        
        <!-- Download Button -->
        <a id="download-btn" href="#" download="SSF_Receipt.jpg" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:to-teal-600 text-white font-extrabold py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
            <i data-lucide="download" class="w-5 h-5"></i> Download Receipt
        </a>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';
        lucide.createIcons();

        // Extract the short filename from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('f');

        if(fileName) {
            // Generate the secure background link
            const imgUrl = supabase.storage.from('receipts').getPublicUrl(fileName).data.publicUrl;
            const img = document.getElementById('receipt-img');
            const btn = document.getElementById('download-btn');
            
            img.onload = () => {
                document.getElementById('loader').classList.add('hidden');
                img.classList.remove('hidden');
            };
            
            img.src = imgUrl;
            btn.href = imgUrl;
            btn.download = fileName;
        } else {
            // Handle missing or broken links
            document.querySelector('p').textContent = "Receipt link is invalid or expired.";
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('download-btn').classList.add('hidden');
            document.querySelector('.text-emerald-600').classList.replace('text-emerald-600', 'text-red-500');
            document.querySelector('.bg-emerald-100').classList.replace('bg-emerald-100', 'bg-red-100');
            document.querySelector('i[data-lucide="check-circle"]').setAttribute('data-lucide', 'x-circle');
            lucide.createIcons();
        }
    </script>
</body>
</html>
