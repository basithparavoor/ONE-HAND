<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Receipt - SSF Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fixed path to be in root folder -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    
    <div class="bg-white rounded-[2rem] shadow-xl p-8 w-full max-w-sm text-center border border-slate-200 relative overflow-hidden">
        <img id="site-logo" src="" class="h-14 w-auto mx-auto mb-5 hidden rounded object-contain" alt="Trust Logo">

        <div id="status-icon" class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-5 shadow-sm">
            <i data-lucide="check-circle" class="w-8 h-8"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Thank You!</h1>
        <p id="thank-you-msg" class="text-slate-500 text-sm font-medium mb-6">Here is your official donation receipt.</p>
        
        <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden mb-6 min-h-[350px] flex items-center justify-center relative shadow-inner">
            <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center gap-3">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-emerald-500"></i>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Fetching...</span>
            </div>
            <img id="receipt-img" class="w-full h-auto hidden relative z-10 transition-opacity duration-300" alt="Official Receipt">
        </div>
        
        <a id="download-btn" href="#" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:to-teal-600 text-white font-extrabold py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
            <i data-lucide="download" class="w-5 h-5"></i> Download Receipt
        </a>
    </div>

    <script type="module">
        // Fixed path to be in root folder
        import { supabase } from './supabase-client.js';
        lucide.createIcons();

        async function initPage() {
            const { data: siteData } = await supabase.from('site_content').select('logo_url, campaign_title, thank_you_message').single();
            if (siteData) {
                if(siteData.logo_url) {
                    const logo = document.getElementById('site-logo');
                    logo.src = siteData.logo_url; logo.classList.remove('hidden');
                }
                if(siteData.campaign_title) document.title = "Receipt - " + siteData.campaign_title;
                if(siteData.thank_you_message) document.getElementById('thank-you-msg').textContent = siteData.thank_you_message;
            }

            // EXTRACTOR: Grabs "1042" directly from "receipt.html?1042"
            const recNo = window.location.search.substring(1); 
            const fileName = recNo ? `SSF_Receipt_${recNo}.jpg` : null;

            if(fileName) {
                const imgUrl = supabase.storage.from('receipts').getPublicUrl(fileName).data.publicUrl + "?t=" + new Date().getTime();
                const img = document.getElementById('receipt-img');
                const btn = document.getElementById('download-btn');
                
                img.onload = () => {
                    document.getElementById('loader').classList.add('hidden');
                    img.classList.remove('hidden');
                };
                
                img.src = imgUrl;
                btn.href = supabase.storage.from('receipts').getPublicUrl(fileName).data.publicUrl;
                btn.download = fileName;
            } else {
                document.getElementById('thank-you-msg').textContent = "Receipt link is invalid or expired.";
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('download-btn').classList.add('hidden');
                document.getElementById('status-icon').className = 'w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5 shadow-sm';
                document.querySelector('i[data-lucide="check-circle"]').setAttribute('data-lucide', 'x-circle');
                lucide.createIcons();
            }
        }
        initPage();
    </script>
</body>
</html>
